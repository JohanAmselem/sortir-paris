<script type="application/ld+json">{"@context":"https://schema.org","@type":"Event","name":"GAVIN DEGRAW","startDate":"2026-10-09T17:30:00.000Z","endDate":null,"eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","location":{"@type":"Place","name":"Bataclan","address":{"@type":"PostalAddress","streetAddress":"50 Boulevard Voltaire","addressLocality":"Paris","postalCode":"75011","addressCountry":"FR"}},"image":["https://bataclan-medias.s3.eu-west-3.amazonaws.com/gavindegraw_2026_web_sliderhome_1920x1080_0_b62c41392b.jpg"],"description":"\u003Cp>Gavin Degraw aurait pu être un artiste pop de plus, enchaînant les mélodies entraînantes et les refrains catchys, livrant des titres calibrés pour les radios et MTV. Le tube qui l’a propulsé en haut des charts, I Don’t Want to Be, correspond presque à cette description. Presque, parce que des années après, il semble ne pas avoir pris une ride. Et pour cause, l’artiste n’a jamais eu d’affinité avec la musique qui se consomme, puis s’oublie. Ce qu’il souhaite, c’est créer des titres intemporels, universels, qu’on ne se lasse pas d’écouter encore et encore. Et clairement, c’est un pari qu’il a relevé haut-la-main.\u003C/p>\u003Cp>Certainement, ses refrains sont catchys et sa musique invite à danser le sourire aux lèvres. Mais si l’on écoute un peu mieux les chansons de ce prodige du piano, qui a suivi ses cours au Berklee College of Music, on se rend rapidement compte que sous le vernis brillant se cachent de véritables pépites. Des textes qui parlent de la réalité, positive ou triste, avec finesse et sans fard. Parce que ce fils d’un gardien de prison et d’une infirmière qui a grandi dans les Catskills de l'État de New York sait de quoi il parle. La vie, la vraie, celle qui est aussi rugueuse que joyeuse, aussi inattendue que fougueuse, il la côtoie depuis son enfance.\u003C/p>\u003Cp>C’est peut-être pour cette raison que ses chansons parlent à tous, qu’elles connectent les gens d’univers aussi différents autour d’une pop que souligne un brin de soul, de folk ou de country. « Je veux qu'ils apprécient la thérapie qu'est la musique. Je veux qu'ils se sentent bien », voilà comment l’artiste parle de son public. Et même si ces textes décrivent parfois des sujets sérieux, ses mélodies réconfortent. Une énergie positive qui se ressent puissance 1000 quand il prend le chemin des scènes. Derrière son piano ou à la guitare, pas besoin d’être mentaliste pour comprendre qu’il est heureux d’être là pour procurer à son public des émotions brutes et une joie de vivre imparable.\u003C/p>\u003Cp>Présenté par : Gérard Drouot Productions (L-R-21-11645/13065)\u003C/p>","offers":{"@type":"Offer","url":"https://billetterie.bataclan.fr/fr/manifestation/697/gavin_degraw","priceCurrency":"EUR","availability":"https://schema.org/Discontinued","validFrom":"2026-10-09T17:30:00.000Z"},"performer":{"@type":"PerformingGroup","name":"GAVIN DEGRAW"}}</script>
