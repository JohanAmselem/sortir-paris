name: Instagram — prepare & publish (manual)

# The schedule runs on Vercel Cron (apps/web/vercel.json): preparation at 13:00
# UTC, publication every 15 minutes. GitHub ran its schedules hours late, so
# this workflow is only kept for manual runs (Actions → Run workflow), with an
# optional dry run.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'prepare or publish'
        required: true
        default: publish
        type: choice
        options: [prepare, publish]
      dry:
        description: 'Dry run (nothing written, nothing sent to Instagram)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: instagram-${{ inputs.step }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STEP: ${{ inputs.step }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET not set: Instagram $STEP skipped"
            exit 0
          fi
          url="https://www.panameclub.fr/api/cron/instagram/$STEP"
          if [ "$DRY" = "1" ]; then url="$url?dry=1"; fi
          curl -fsS --max-time 320 -X POST -H "Authorization: Bearer $CRON_SECRET" "$url"
          echo
