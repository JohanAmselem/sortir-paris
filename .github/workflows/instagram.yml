name: Instagram — prepare & publish

# Publication times are in Paris time (18:00 every day, Monday 08:00, Thursday
# 12:00) and stored on each post (scheduled_at). GitHub cron is UTC and has no
# DST, so the publish job simply runs every 30 minutes from 05:00 to 18:30 UTC
# and publishes whatever is due. Preparation (tomorrow's drafts, previewed in
# /admin/instagram) runs at 13:00 UTC, i.e. 14:00 or 15:00 in Paris.
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0,30 5-18 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: 'prepare or publish'
        required: true
        default: publish
        type: choice
        options: [prepare, publish]
      dry:
        description: 'Dry run (nothing written, nothing sent to Instagram)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: instagram-${{ github.event.schedule == '0 13 * * *' && 'prepare' || inputs.step || 'publish' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STEP: ${{ github.event.schedule == '0 13 * * *' && 'prepare' || inputs.step || 'publish' }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET not set: Instagram $STEP skipped"
            exit 0
          fi
          url="https://www.panameclub.fr/api/cron/instagram/$STEP"
          if [ "$DRY" = "1" ]; then url="$url?dry=1"; fi
          curl -fsS --max-time 320 -X POST -H "Authorization: Bearer $CRON_SECRET" "$url"
          echo
