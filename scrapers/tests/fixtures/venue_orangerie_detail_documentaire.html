            "description": "Comment le regard du public sur une œuvre peut-il évoluer avec le temps ? D’abord ignorés, les Nymphéas de Claude Monet s’inscrivent pourtant dans la continuité de ses grandes séries et poussent encore plus loin son exploration du temps et du paysage. À sa mort en 1926, ses œuvres tardives restent méconnues, et les Grandes Décorations présentées en 1927 à l’Orangerie ne rencontrent pas leur public. Ce documentaire retrace la redécouverte progressive de ces œuvres monumentales, portée par les peintres américains de l’abstraction, un milliardaire japonais et la réouverture de Giverny, jusqu’à la « Monet Mania » internationale qui consacre aujourd’hui les Nymphéas comme une œuvre majeure de l’histoire de la peinture moderne.Documentaire réalisé par Anne-Cécile Genre Coproduit par ARTE France, Bleu Kobalt, l’Établissement public des musées d\u0027Orsay et de l\u0027Orangerie, Avrotros Avec le soutient de la PROCIREP, socété des producteurs et de l’ANGOAAvec la participation du Centre national du cinéma et de l\u0027image animée  À voir aussi :Sur arte.tvSur ARTE le 11 octobre à 17h50",
