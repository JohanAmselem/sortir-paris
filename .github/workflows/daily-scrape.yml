name: Scrape events

on:
  schedule:
    # 05:30 and 15:30 UTC (07:30 / 17:30 Paris in summer, 06:30 / 16:30 in winter)
    - cron: '30 5 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Run a single source (name from `python cron.py --list`), empty = all groups'
        required: false
        default: ''
      skip_post:
        description: 'Skip geocode / dedup / expiry / Meilisearch sync'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: scrape-events
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scrape:
    name: scrape (${{ matrix.group }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [official, ticketing, theatre, media, venues, culture, cinema]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r scrapers/requirements.txt
      - name: Scrape group ${{ matrix.group }}
        working-directory: scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python cron.py --group ${{ matrix.group }}

  scrape-one:
    name: scrape (${{ inputs.source }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r scrapers/requirements.txt
      - name: Scrape ${{ inputs.source }}
        working-directory: scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SOURCE: ${{ inputs.source }}
        run: python cron.py --source "$SOURCE"

  post:
    name: geocode + dedup + expiry + search sync
    needs: [scrape, scrape-one]
    # run even if a scrape group failed (one broken source must not block publication)
    if: ${{ always() && !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.skip_post) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r scrapers/requirements.txt
      - name: Post-processing
        working-directory: scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_WRITE_KEY: ${{ secrets.MEILISEARCH_WRITE_KEY }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
        run: python cron.py --post
